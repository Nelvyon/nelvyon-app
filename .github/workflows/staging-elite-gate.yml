name: Staging Elite Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "backend/saas/**"
      - "backend/db/migrations/**"
      - "backend/autonomous/**"
      - "scripts/run-staging-*.mjs"
      - "scripts/run-local-elite-reinforce.mjs"
      - "scripts/staging-smoke-*.mjs"
      - "scripts/verify-os-saas-100.mjs"
      - "scripts/lib/**"
      - ".github/workflows/staging-elite-gate.yml"

concurrency:
  group: staging-elite-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elite-gate:
    name: P0 + 8 OS packs + SaaS/OS 100%
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run elite staging gate
        env:
          STAGING_BASE_URL: https://ideal-victory-staging.up.railway.app
          # Wait up to 10m for SHA match; then proceed if prod health is OK (scripts-only pushes skip Railway rebuild).
          DEPLOY_WAIT_MAX_ATTEMPTS: 40
          DEPLOY_WAIT_SOFT: "true"
        run: node scripts/run-staging-elite-gate.mjs
