name: Database Backup

# Weekly Postgres backup — requires secret DATABASE_URL (production read-only recommended).
# Artifacts retained 30 days. Restore drill: see docs/CEO_FINAL_ACTIONS.md

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      allow_missing_secret:
        description: "Skip backup if DATABASE_URL missing (manual only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump to artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pg client + SQLAlchemy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pip install sqlalchemy psycopg2-binary pytest

      - name: Validate DATABASE_URL is reachable from GitHub Actions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set DATABASE_PUBLIC_URL (preferred) or DATABASE_URL in GitHub secrets"
            exit 1
          fi
          if echo "$DATABASE_URL" | grep -q 'railway\.internal'; then
            echo "::error::DATABASE_URL uses postgres.railway.internal — GitHub Actions cannot reach it."
            echo "Use Railway Postgres → Connect → Public URL as secret DATABASE_PUBLIC_URL"
            exit 1
          fi

      - name: Require backup URL on schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
          ALLOW_MISSING: ${{ github.event.inputs.allow_missing_secret || 'false' }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$IS_SCHEDULE" = "true" ] || [ "$ALLOW_MISSING" != "true" ]; then
              echo "::error::DATABASE_PUBLIC_URL (or DATABASE_URL) not configured"
              exit 1
            fi
            exit 0
          fi

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipped — no DATABASE_URL"
            exit 0
          fi
          mkdir -p backups
          python backend/scripts/db_backup_restore.py backup \
            --database-url "$DATABASE_URL" \
            --output-dir backups
          ls -la backups/
          test -n "$(ls -A backups 2>/dev/null)"

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nelvyon-db-backup-${{ github.run_number }}
          path: backups/*
          retention-days: 30

  verify-sqlite:
    name: SQLite backup round-trip (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify SQLite backup/restore
        run: |
          pip install pytest sqlalchemy
          cd backend && python -m pytest tests/test_backup_phase1.py -q
