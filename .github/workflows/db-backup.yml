name: Database Backup

# Weekly Postgres backup — requires DATABASE_PUBLIC_URL (or public DATABASE_URL).
# Artifacts retained 30 days. Restore drill: see docs/CEO_FINAL_ACTIONS.md

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      allow_missing_secret:
        description: "Skip backup if DATABASE_URL missing (manual only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump to artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL 18 client (PGDG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          pg_dump --version

      - name: Install Python deps
        run: pip install sqlalchemy psycopg2-binary

      - name: Validate DATABASE_URL is reachable from GitHub Actions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set DATABASE_PUBLIC_URL (preferred) or DATABASE_URL in GitHub secrets"
            exit 1
          fi
          if echo "$DATABASE_URL" | grep -q 'railway\.internal'; then
            echo "::error::DATABASE_URL uses postgres.railway.internal — GitHub Actions cannot reach it."
            echo "Use Railway Postgres → Connect → Public URL as secret DATABASE_PUBLIC_URL"
            exit 1
          fi

      - name: Require backup URL on schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
          ALLOW_MISSING: ${{ github.event.inputs.allow_missing_secret || 'false' }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$IS_SCHEDULE" = "true" ] || [ "$ALLOW_MISSING" != "true" ]; then
              echo "::error::DATABASE_PUBLIC_URL (or DATABASE_URL) not configured"
              exit 1
            fi
            exit 0
          fi

      - name: Verify pg_dump major matches Postgres server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            exit 0
          fi
          PG_DUMP_MAJOR=$(pg_dump --version | sed -n 's/.*PostgreSQL) \([0-9][0-9]*\).*/\1/p')
          SERVER_MAJOR=$(psql "$DATABASE_URL" -tAc "SHOW server_version;" | sed -E 's/^([0-9]+).*/\1/')
          echo "pg_dump major: $PG_DUMP_MAJOR"
          echo "server major: $SERVER_MAJOR"
          if [ "$PG_DUMP_MAJOR" != "$SERVER_MAJOR" ]; then
            echo "::error::pg_dump major ($PG_DUMP_MAJOR) != server major ($SERVER_MAJOR)"
            exit 1
          fi

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipped — no DATABASE_URL"
            exit 0
          fi
          mkdir -p backups
          python backend/scripts/db_backup_restore.py backup \
            --database-url "$DATABASE_URL" \
            --output-dir backups
          ls -la backups/
          test -n "$(find backups -maxdepth 1 -name '*.dump' -print -quit)"

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nelvyon-db-backup-${{ github.run_number }}
          path: backups/*
          retention-days: 30

  verify-sqlite:
    name: SQLite backup round-trip (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify SQLite backup/restore
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -m pytest tests/test_backup_phase1.py -q
