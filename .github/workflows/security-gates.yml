name: Security Gates

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "apps/web/**"
      - "backend/**"
      - ".github/workflows/security-gates.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit apps/web (fail on critical only; high tracked as KI-012)
        working-directory: apps/web
        run: pnpm audit --audit-level critical

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rollback: repo variable NELVYON_GITLEAKS_ENABLED=0
    if: ${{ vars.NELVYON_GITLEAKS_ENABLED != '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  trivy-fs:
    name: Trivy filesystem scan (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Feature flag: set repo variable NELVYON_TRIVY_ENABLED=0 to rollback
    if: ${{ vars.NELVYON_TRIVY_ENABLED != '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  migrations:
    name: Validate migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Elite range 401–507
        run: node scripts/validate-saas-migrations.mjs
      - name: Post-elite 508–515
        run: node scripts/validate-post-elite-migrations.mjs

