name: Security Gates

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - ".github/workflows/security-gates.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (critical/high)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit apps/web (fail on critical)
        working-directory: apps/web
        run: pnpm audit --audit-level critical

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  migrations:
    name: Validate migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Elite range 401–507
        run: node scripts/validate-saas-migrations.mjs
      - name: Post-elite 508–511
        run: node scripts/validate-post-elite-migrations.mjs
