# Railway config-as-code for @nelvyon/web (production / monorepo root).
# Evidence 2026-07-21: deploy meta configFile=/railway.toml, dockerfilePath=/Dockerfile.
# Dashboard settings are overridden by this file for the fields defined here.
# Docs: https://docs.railway.com/config-as-code/reference

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# QUE CAMBIOS MERECEN UN DESPLIEGUE. Si algo que entra en el build no esta aqui,
# su commit se marca SKIPPED y produccion se queda atras EN VERDE.
#
# Ya paso dos veces, y la segunda con esta misma lista:
#
#   · con la 564, un commit que solo anadia un fichero en `backend/db/migrations/`
#     se marco SKIPPED mientras el backend desplegaba en SUCCESS: dos despliegues
#     verdes y ninguna migracion aplicada. Se anadio ese patron;
#   · con `95897a55`, un commit que solo tocaba `backend/health/` se marco
#     SKIPPED. `origin/main` y produccion divergieron sin una sola senal roja.
#
# La correccion de la primera vez fue anadir el directorio concreto que dolio.
# Por eso volvio a pasar: la lista describia SITIOS RECORDADOS en vez del
# criterio. El criterio es «todo lo que entra en el build», y `apps/web` importa
# de `backend/` en 870 sitios. Asi que va `backend/**` entero, no sus subcarpetas
# de una en una.
#
# Y va tambien la propia configuracion del despliegue: un cambio en el Dockerfile
# o en este fichero cambia lo que se construye.
#
# Lo vigila `test_ningun_cambio_que_entra_en_el_build_se_queda_sin_desplegar`.
watchPatterns = [
  "apps/web/**",
  "backend/**",
  "packages/**",
  "Dockerfile",
  "railway.toml",
  "railway.json",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
# Official preDeployCommand (array, max 1). Runs after build, before traffic.
# ADR-064: migrate:prod is gated — production applies SQL only with
# NELVYON_PROD_MIGRATE_APPROVED=1 + APPROVED_BY (see docs/ops/PROD_MIGRATE_GATE_RUNBOOK.md).
# Staging continues to apply automatically when RAILWAY_ENVIRONMENT_NAME=staging.
preDeployCommand = ["pnpm -C apps/web migrate:prod"]
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
